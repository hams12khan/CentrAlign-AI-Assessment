[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centralign-ai-employee-runtime"
version = "1.0.0"
description = "Autonomous Enterprise AI Employee Runtime with Kahn DAG Scheduling, RBAC Policy Guardrails, and Cryptographic Evidence"
authors = [
    { name = "Principal AI Systems Engineer", email = "engineering@centralign.ai" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "groq>=1.7.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.0",
    "duckdb>=1.2.0",
    "playwright>=1.49.0",
    "pillow>=11.0.0",
    "streamlit>=1.42.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]
